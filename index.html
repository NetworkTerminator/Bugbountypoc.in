<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BugBountyPOC Labs</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #fff;
    color: #111;
  }

  /* Navigation */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 30px;
    background-color: #f8f8f8;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  nav .logo {
    font-weight: bold;
    font-size: 1.3rem;
    color: #111;
  }
  nav ul {
    list-style: none;
    display: flex;
    gap: 15px;
    margin: 0;
    padding: 0;
  }
  nav ul li a {
    text-decoration: none;
    color: #111;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 4px;
    transition: background 0.2s;
  }
  nav ul li a:hover {
    background-color: #e0e0e0;
  }

  /* Intro Section */
  .intro {
    max-width: 900px;
    margin: 40px auto;
    text-align: center;
    padding: 0 20px;
  }
  .intro h1 {
    font-size: 2rem;
    margin-bottom: 10px;
  }
  .intro p {
    font-size: 1rem;
    margin-bottom: 20px;
  }
  .intro .youtube-btn {
    display: inline-block;
    background-color: #111;
    color: #fff;
    padding: 10px 20px;
    border-radius: 4px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.2s;
  }
  .intro .youtube-btn:hover {
    background-color: #333;
  }

  /* YouTube Section */
  .youtube-section {
    max-width: 900px;
    margin: 40px auto;
    text-align: center;
    padding: 0 20px;
  }
  .youtube-section h2 {
    margin-bottom: 20px;
    font-size: 1.8rem;
  }
  .youtube-section a {
    display: inline-block;
    background-color: #111;
    color: #fff;
    padding: 10px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 500;
    transition: background 0.2s;
  }
  .youtube-section a:hover {
    background-color: #333;
  }

  /* Mobile responsive */
  @media (max-width: 600px) {
    nav {
      flex-direction: column;
      align-items: flex-start;
    }
    nav ul {
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <div class="logo">BugBountyPOC</div>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="mailto:youremail@example.com">Contact</a></li>
    <li><a href="https://www.youtube.com/@networkterminatorsecurity" target="_blank">YouTube</a></li>
  </ul>
</nav>

<!-- Intro Section -->
<section class="intro">
  <h1>Welcome to BugBountyPOC Labs 🚀</h1>
  <p>Practice XSS, Business Logic Bugs, and more while following step-by-step tutorials!</p>
  <a href="https://www.youtube.com/@networkterminatorsecurity" target="_blank" class="youtube-btn">📺 Visit YouTube Channel</a>
</section>

</body>
</html>
